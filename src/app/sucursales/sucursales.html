<h2>Sucursales</h2>

<table>
  <thead>
    <tr><th>Nombre</th><th>Ciudad</th><th>Dirección</th><th>Empleados</th></tr>
  </thead>
  <tbody>
    @for (s of sucursales(); track s.id) {
      <tr>
        <td>{{ s.nombre }}</td>
        <td>{{ s.ciudad }}</td>
        <td>{{ s.direccion }}</td>
        <td>{{ s.cantEmpleados }}</td>
      </tr>
    }
  </tbody>
</table>

<h2>Clientes</h2>
<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Apellido</th>
      <th>DNI</th>
    </tr>
  </thead>
  <tbody>
    @for(cliente of clientes(); track cliente.id){
      <tr>
        <td>{{ cliente.nombre }}</td>
        <td>{{ cliente.apellido }}</td>
        <td>{{ cliente.dni }}</td>
      </tr>
    }
  </tbody>
</table>
